[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-code-intelligence"
version = "0.1.0"
description = "Repository intelligence primitives for AI-assisted software engineering"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
